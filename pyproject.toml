[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "quietops"
version = "0.1.0"
description = "Evidence-linked local Gemma handoffs for noisy Docker and Linux logs"
requires-python = ">=3.10"
authors = [{ name = "QuietOps Contributors" }]
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
quietops = "quietops.cli:main"

[tool.setuptools.packages.find]
include = ["quietops*"]
